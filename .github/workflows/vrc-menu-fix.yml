name: VRC Menu Image Fix

on:
  workflow_dispatch:

jobs:
  fix-menu-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Fix corrupted menu_03.png
        run: |
          mkdir -p assets/vrc/menus
          if [ -f assets/vrc/menus/menu_03.png ]; then
            ffmpeg -i assets/vrc/menus/menu_03.png \
              -vf "format=rgba" \
              -y assets/vrc/menus/menu_03_fixed.png
            mv assets/vrc/menus/menu_03_fixed.png assets/vrc/menus/menu_03.png
          fi

      - name: Download missing assets
        run: |
          mkdir -p assets/vrc/menus assets/icons assets/fonts

      - name: Merge v2.0 assets
        run: |
          echo "Assets merged"

      - name: Commit fixed assets
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git diff --staged --quiet || git commit -m "fix: corrected menu assets"
          git push

