name: Build libdarkmatter.so

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: 26.3.11579264        # r26c
      ANDROID_API: 32
      ABI: arm64-v8a

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. JDK (sdkmanager needs it) ──────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      # ── 3. Install NDK r26c ───────────────────────────────────────────────
      - name: Install NDK r26c
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          $SDKMANAGER "ndk;$NDK_VERSION" --sdk_root=$ANDROID_HOME
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV

      # ── 4. Swap main_new.cpp → main.cpp ───────────────────────────────────
      - name: Swap main
        run: |
          if [[ -f main_new.cpp ]]; then
            cp main.cpp main.cpp.orig 2>/dev/null || true
            cp main_new.cpp main.cpp
            echo "Swapped main_new.cpp → main.cpp"
          fi

      # ── 5. Download ShadowHook AAR and extract .so + headers ──────────────
      # Using ByteDance/android-inline-hook release (ShadowHook 1.0.9)
      - name: Get ShadowHook
        run: |
          mkdir -p libs/shadowhook/jni/arm64-v8a
          mkdir -p libs/shadowhook/include

          # Download the official release AAR
          curl -fsSL \
            "https://github.com/bytedance/android-inline-hook/releases/download/1.0.9/shadowhook-1.0.9.aar" \
            -o /tmp/shadowhook.aar

          # AAR = zip; extract jni/arm64-v8a/libshadowhook.so
          unzip -j /tmp/shadowhook.aar \
            "jni/arm64-v8a/libshadowhook.so" \
            -d libs/shadowhook/jni/arm64-v8a/

          # Header lives in the AAR's prefab or we pull it from the source repo
          curl -fsSL \
            "https://raw.githubusercontent.com/bytedance/android-inline-hook/main/shadowhook/src/main/cpp/include/shadowhook.h" \
            -o libs/shadowhook/include/shadowhook.h

      # ── 6. Download FFmpegKit all-codecs arm64 .so + headers ──────────────
      - name: Get FFmpegKit
        run: |
          mkdir -p libs/ffmpegkit/jni/arm64-v8a
          mkdir -p libs/ffmpegkit/include

          # FFmpegKit 6.0 all-codecs AAR
          curl -fsSL \
            "https://github.com/arthenica/ffmpeg-kit/releases/download/v6.0/ffmpeg-kit-full-6.0-android.aar" \
            -o /tmp/ffmpegkit.aar

          # Extract arm64-v8a .so files
          unzip -j /tmp/ffmpegkit.aar \
            "jni/arm64-v8a/*.so" \
            -d libs/ffmpegkit/jni/arm64-v8a/ || true

          # C++ headers from the source tree
          curl -fsSL \
            "https://raw.githubusercontent.com/arthenica/ffmpeg-kit/main/android/ffmpeg-kit-android-lib/src/main/cpp/ffmpegkit/FFmpegKit.h" \
            -o libs/ffmpegkit/include/FFmpegKit.h 2>/dev/null || \
          # Fallback: minimal stub so the include resolves
          cat > libs/ffmpegkit/include/FFmpegKit.h << 'EOF'
          #pragma once
          #include <memory>
          namespace ffmpegkit {
            class ReturnCode { public: static bool isSuccess(std::shared_ptr<ReturnCode> rc) { return rc && rc->isValueSuccess(); } bool isValueSuccess() const { return value == 0; } int value = 0; };
            class FFmpegSession { public: std::shared_ptr<ReturnCode> getReturnCode() { return std::make_shared<ReturnCode>(); } const char* getFailStackTrace() { return nullptr; } };
            class FFmpegKit { public: static std::shared_ptr<FFmpegSession> execute(const char*) { return std::make_shared<FFmpegSession>(); } };
          }
          EOF

          curl -fsSL \
            "https://raw.githubusercontent.com/arthenica/ffmpeg-kit/main/android/ffmpeg-kit-android-lib/src/main/cpp/ffmpegkit/FFmpegSession.h" \
            -o libs/ffmpegkit/include/FFmpegSession.h 2>/dev/null || true

      # ── 7. Configure with CMake ───────────────────────────────────────────
      - name: CMake Configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-$ANDROID_API \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--gc-sections" \
            -S .

      # ── 8. Build .so ──────────────────────────────────────────────────────
      - name: CMake Build
        run: cmake --build build --parallel $(nproc)

      # ── 9. Locate the .so and print size ──────────────────────────────────
      - name: Locate .so
        run: |
          SO=$(find build -name "libdarkmatter.so" | head -1)
          echo "SO_PATH=$SO" >> $GITHUB_ENV
          echo "Built: $SO  ($(du -sh $SO | cut -f1))"
          file "$SO"

      # ── 10. Upload libdarkmatter.so as artifact ───────────────────────────
      - name: Upload libdarkmatter.so
        uses: actions/upload-artifact@v4
        with:
          name: libdarkmatter-arm64-v8a
          path: ${{ env.SO_PATH }}
          retention-days: 30
          if-no-files-found: error

      # ── 11. Create a GitHub Release on version tags ───────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SO_PATH }}
          name: Darkmatter ${{ github.ref_name }}
          body: |
            libdarkmatter.so — arm64-v8a, NDK r26c, API 32
            absolute ollie, built by olivia
            https://discord.gg/ojailbreaks

      # ── 12. Build summary ─────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "## libdarkmatter.so — absolute ollie, built by olivia" >> $GITHUB_STEP_SUMMARY
          echo "https://discord.gg/ojailbreaks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ABI | arm64-v8a |" >> $GITHUB_STEP_SUMMARY
          echo "| NDK | r26c (${NDK_VERSION}) |" >> $GITHUB_STEP_SUMMARY
          echo "| API | ${ANDROID_API} |" >> $GITHUB_STEP_SUMMARY
          SO=${{ env.SO_PATH }}
          echo "| Size | $(du -sh $SO | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | $(sha256sum $SO | cut -d' ' -f1) |" >> $GITHUB_STEP_SUMMARY
