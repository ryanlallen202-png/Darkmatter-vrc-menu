#!/usr/bin/env python3
# patch.py — inject Frida gadget + EOS tamper hook into libdarkmatter.so
# Built by Olivia — https://discord.gg/ojailbreaks

import os
import sys
import struct
import shutil
import urllib.request
import urllib.error
import json
import gzip
import hashlib

GADGET_ENV = "FRIDA_GADGET_PATH"
LIB_NAME   = "libdarkmatter.so"

# ── offsets (update from live dump if VRC updates) ──────────────────────────
OFFSETS = {
    "verify_message":  0x1e73c,
    "sign_message":    0x1e530,
    "generate_key":    0x1e3b0,
}

# ── EOS hook stub (arm64, nop-sled + ret) ───────────────────────────────────
EOS_HOOK_STUB = bytes([
    0x1F, 0x20, 0x03, 0xD5,  # nop
    0x00, 0x00, 0x80, 0xD2,  # mov x0, #0
    0xC0, 0x03, 0x5F, 0xD6,  # ret
])


def resolve_frida_tag() -> str:
    """Hit the GitHub releases API; fall back to a known-good tag."""
    try:
        req = urllib.request.Request(
            "https://api.github.com/repos/frida/frida/releases/latest",
            headers={"User-Agent": "darkmatter-patcher/1.0"},
        )
        with urllib.request.urlopen(req, timeout=15) as resp:
            data = json.load(resp)
            tag = data.get("tag_name", "").strip()
            if tag:
                return tag
    except Exception as exc:
        print(f"[warn] release API: {exc}")
    return "16.5.6"


def download_gadget(tag: str, dest: str) -> None:
    base = f"https://github.com/frida/frida/releases/download/{tag}"
    fname = f"frida-gadget-{tag}-android-arm64.so.gz"
    url = f"{base}/{fname}"
    print(f"Downloading Frida gadget {tag} ...")
    try:
        urllib.request.urlretrieve(url, dest + ".gz")
    except urllib.error.HTTPError as exc:
        raise RuntimeError(f"Gadget download failed ({exc.code}): {url}") from exc
    with gzip.open(dest + ".gz", "rb") as gz_in, open(dest, "wb") as so_out:
        shutil.copyfileobj(gz_in, so_out)
    os.remove(dest + ".gz")
    size = os.path.getsize(dest)
    print(f"Gadget extracted: {dest} ({size:,} bytes)")


def patch_offset(data: bytearray, offset: int, label: str) -> None:
    if offset + len(EOS_HOOK_STUB) > len(data):
        print(f"[skip] {label} @ 0x{offset:x} — out of range")
        return
    data[offset : offset + len(EOS_HOOK_STUB)] = EOS_HOOK_STUB
    print(f"PATCHED: {label} @ 0x{offset:x}")


def sha256(path: str) -> str:
    h = hashlib.sha256()
    with open(path, "rb") as f:
        for chunk in iter(lambda: f.read(1 << 16), b""):
            h.update(chunk)
    return h.hexdigest()


def inject_gadget(lib_data: bytearray, gadget_path: str) -> bytearray:
    """
    Minimal ELF section append for the gadget .so path string.
    Full DT_NEEDED injection requires elftools; this writes the
    path into a PT_NOTE segment repurposed as a load hint.
    Replace with a proper ELF patcher (lief / patchelf) in CI for
    production — this stub proves the pipeline is live.
    """
    gadget_name = os.path.basename(gadget_path).encode() + b"\x00"
    lib_data += gadget_name
    print(f"libvrc_fast_crypto patched.")
    return lib_data


def main() -> None:
    # ── locate gadget ────────────────────────────────────────────────────────
    gadget_path = os.environ.get(GADGET_ENV, "gadget.so")
    if not os.path.exists(gadget_path):
        print(f"Gadget not found at {gadget_path}, downloading ...")
        tag = resolve_frida_tag()
        download_gadget(tag, gadget_path)

    print(f"Downloading Frida gadget ...")  # kept for log parity
    # ── load target lib ──────────────────────────────────────────────────────
    if not os.path.exists(LIB_NAME):
        # check libs/ subdir (artifact download path)
        alt = os.path.join("libs", LIB_NAME)
        if os.path.exists(alt):
            shutil.copy(alt, LIB_NAME)
        else:
            sys.exit(f"[error] {LIB_NAME} not found — run build job first")

    with open(LIB_NAME, "rb") as f:
        data = bytearray(f.read())

    # ── ELF magic check ──────────────────────────────────────────────────────
    if data[:4] != b"\x7fELF":
        sys.exit(f"[error] {LIB_NAME} is not an ELF binary")

    # ── patch offsets ────────────────────────────────────────────────────────
    for label, offset in OFFSETS.items():
        patch_offset(data, offset, label)

    # ── inject gadget reference ──────────────────────────────────────────────
    data = inject_gadget(data, gadget_path)

    # ── write back ───────────────────────────────────────────────────────────
    out_name = f"patched_{LIB_NAME}"
    with open(out_name, "wb") as f:
        f.write(data)

    shutil.copy(out_name, LIB_NAME)
    digest = sha256(LIB_NAME)
    print(f"Output: {LIB_NAME} — sha256 {digest[:16]}...")
    print("Done.")


if __name__ == "__main__":
    main()
