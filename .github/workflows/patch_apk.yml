name: Patch and Release VRChat APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v2.0)"
        required: false
        default: ""

jobs:
  patch:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      MODULE_PKG:  com.darkmatter.module
      SIGNED_PKG:  com.vrchat.oculus.quest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 python3-pip wget unzip
          pip install cryptography --break-system-packages -q

      - name: Reassemble APK from parts
        run: |
          for part in partaa partab partac partad partae partaf partag partah partai partaj partak partal partam partan; do
            wget -q "https://github.com/ryanlallen202-png/Darkmatter-vrc-menu/releases/download/v1.0/DarkMatter.$part" \
              -O "DarkMatter.$part"
          done
          cat DarkMatter.part* > VRChat.apk
          rm -f DarkMatter.part*
          echo "APK size: $(du -sh VRChat.apk | cut -f1)"

      - name: Extract libvrc_fast_crypto.so
        run: |
          mkdir -p unpacked/lib/arm64-v8a
          unzip -q VRChat.apk lib/arm64-v8a/libvrc_fast_crypto.so -d unpacked/

      - name: Patch libvrc_fast_crypto.so
        run: python3 patch.py

      - name: Download latest Frida gadget
        run: |
          # Get latest tag
          FRIDA_VER=$(curl -s https://api.github.com/repos/frida/frida/releases/latest \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          echo "Frida version: $FRIDA_VER"

          # List all assets for that release and find the arm64 gadget
          ASSET_URL=$(curl -s "https://api.github.com/repos/frida/frida/releases/tags/${FRIDA_VER}" \
            | python3 -c "
          import json,sys
          assets = json.load(sys.stdin).get('assets', [])
          for a in assets:
              n = a['name']
              # match both old .so.gz and new .zip naming
              if 'gadget' in n and 'android' in n and 'arm64' in n and ('arm64-v8a' not in n) and ('x86' not in n):
                  print(a['browser_download_url'])
                  break
          ")

          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: could not find arm64 gadget asset for $FRIDA_VER"
            echo "Available assets:"
            curl -s "https://api.github.com/repos/frida/frida/releases/tags/${FRIDA_VER}" \
              | python3 -c "import json,sys; [print(a['name']) for a in json.load(sys.stdin).get('assets',[])]"
            exit 1
          fi

          echo "Downloading: $ASSET_URL"
          curl -fL "$ASSET_URL" -o gadget_raw

          # Handle both .gz and .zip
          if echo "$ASSET_URL" | grep -q ".so.gz"; then
            gunzip gadget_raw
            mv gadget_raw_decompressed frida-gadget.so 2>/dev/null || mv gadget_raw frida-gadget.so
          elif echo "$ASSET_URL" | grep -q ".zip"; then
            unzip -q gadget_raw -d gadget_dir
            find gadget_dir -name "*.so" | head -1 | xargs -I{} cp {} frida-gadget.so
          else
            # bare .so
            cp gadget_raw frida-gadget.so
          fi

          echo "Gadget ready: $(du -sh frida-gadget.so | cut -f1)"

      - name: Download latest libdarkmatter.so from build artifact
        run: |
          ART_URL=$(curl -s \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=10" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            | python3 -c "
          import json,sys
          arts=[a for a in json.load(sys.stdin)['artifacts'] if 'darkmatter-release' in a['name'] and not a['expired']]
          print(arts[0]['archive_download_url']) if arts else print('')
          ")
          if [ -n "$ART_URL" ]; then
            curl -fL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$ART_URL" -o dm.zip
            unzip -q dm.zip
            echo "libdarkmatter.so: $(du -sh libdarkmatter.so | cut -f1)"
          else
            echo "No fresh artifact — using patched crypto .so as fallback"
          fi

      - name: Sign VRChat APK (package=${{ env.SIGNED_PKG }})
        env:
          SIGNED_PKG: ${{ env.SIGNED_PKG }}
        run: python3 sign.py

      - name: Build Darkmatter module APK (package=${{ env.MODULE_PKG }})
        env:
          MODULE_PKG: ${{ env.MODULE_PKG }}
        run: python3 build_module.py

      - name: Compute release tag
        id: tag
        run: |
          INPUT="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT" ]; then
            echo "tag=$INPUT" >> $GITHUB_OUTPUT
          else
            echo "tag=patched-$(date +%Y%m%d)-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Delete stale assets from v1.0 release
        run: |
          python3 - << 'EOF'
          import json, urllib.request, urllib.error
          TOKEN = "${{ secrets.GITHUB_TOKEN }}"
          OWNER = "ryanlallen202-png"
          REPO  = "Darkmatter-vrc-menu"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{OWNER}/{REPO}/releases/442843474/assets",
              headers={"Authorization": f"token {TOKEN}", "Accept": "application/vnd.github+json"}
          )
          with urllib.request.urlopen(req) as r:
              assets = json.loads(r.read())
          stale = ["darkmatter-module.apk","DarkMatter-patched-signed.apk","libvrc_fast_crypto_patched.so"]
          for a in assets:
              if a["name"] in stale:
                  del_req = urllib.request.Request(
                      f"https://api.github.com/repos/{OWNER}/{REPO}/releases/assets/{a['id']}",
                      headers={"Authorization": f"token {TOKEN}", "Accept": "application/vnd.github+json"},
                      method="DELETE"
                  )
                  try:
                      urllib.request.urlopen(del_req)
                      print(f"Deleted: {a['name']}")
                  except Exception as e:
                      print(f"Skip: {e}")
          EOF

      - name: Create new release with both APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Darkmatter ${{ steps.tag.outputs.tag }} — patched VRChat + module"
          prerelease: ${{ !startsWith(steps.tag.outputs.tag, 'v') }}
          body: |
            ## Darkmatter ${{ steps.tag.outputs.tag }}

            ### Files
            | File | Description |
            |------|-------------|
            | `darkmatter-module.apk` | No-root module — package `com.darkmatter.vrcmenu` |
            | `DarkMatter-patched-signed.apk` | Patched VRChat — package `com.darkmatter.vrcmenu.signed` |

            ### Install (no root needed)
            1. Download `DarkMatter-patched-signed.apk` in Quest browser
            2. Uninstall stock VRChat first: Settings → Apps → VRChat → Uninstall
            3. Tap the downloaded APK → Install

            Built from `${{ github.sha }}`
          files: |
            DarkMatter-patched-signed.apk
            darkmatter-module.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
