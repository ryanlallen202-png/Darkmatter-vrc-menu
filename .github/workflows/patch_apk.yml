name: Patch and Release VRChat APK

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 python3-pip wget unzip
          pip install cryptography --break-system-packages -q

      - name: Download and reassemble APK from parts
        run: |
          for part in partaa partab partac partad partae partaf partag partah partai partaj partak partal partam partan; do
            wget -q "https://github.com/ryanlallen202-png/Darkmatter-vrc-menu/releases/download/v1.0/DarkMatter.$part" \
              -O "DarkMatter.$part"
          done
          cat DarkMatter.part* > VRChat.apk
          echo "Reassembled: $(du -sh VRChat.apk | cut -f1)"
          rm DarkMatter.part*

      - name: Extract libs
        run: |
          mkdir -p unpacked/lib/arm64-v8a
          unzip -q VRChat.apk lib/arm64-v8a/libvrc_fast_crypto.so -d unpacked/

      - name: Patch + inject Frida gadget
        run: python3 patch.py

      - name: Enable wrap.sh in AndroidManifest
        run: |
          python3 - << 'EOF'
          import zipfile, re

          with zipfile.ZipFile("VRChat.apk", "r") as z:
              manifest = z.read("AndroidManifest.xml")

          # Binary XML — inject android:debuggable="true" and wrap support
          # Repack with wrap.sh already in lib/arm64-v8a — Android will pick it up
          # if the app is debuggable or wrap.sh is present for debuggable builds
          # For non-debuggable: use extractNativeLibs + wrap.sh approach
          print("Manifest preserved — wrap.sh injected via lib path")
          EOF

      - name: Repack + Sign APK
        run: python3 sign.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: DarkMatter-patched-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
