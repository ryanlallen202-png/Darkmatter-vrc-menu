name: Patch and Release VRChat APK

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 python3-pip wget unzip file
          pip install cryptography --break-system-packages -q

      - name: Reassemble APK
        run: |
          for part in partaa partab partac partad partae partaf partag partah partai partaj partak partal partam partan; do
            wget -q "https://github.com/ryanlallen202-png/Darkmatter-vrc-menu/releases/download/v1.0/DarkMatter.$part" -O "DarkMatter.$part"
          done
          cat DarkMatter.part* > VRChat.apk && rm -f DarkMatter.part*
          echo "APK: $(du -sh VRChat.apk | cut -f1)"

      - name: Extract + patch lib
        run: |
          mkdir -p unpacked/lib/arm64-v8a
          unzip -q VRChat.apk lib/arm64-v8a/libvrc_fast_crypto.so -d unpacked/
          python3 patch.py

      - name: Build modded VRChat APK (com.darkmatter.vrchat)
        run: python3 sign.py

      - name: Build Darkmatter module APK (com.darkmatter.menu)
        run: python3 build_module.py

      - name: Verify both APKs
        run: |
          python3 - << 'EOF'
          import zipfile, os, sys, struct

          errors = []

          # Check modded VRChat APK
          apk = "DarkMatter-modded-signed.apk"
          if not os.path.exists(apk) or os.path.getsize(apk) < 100*1024*1024:
              errors.append(f"FAIL: {apk} too small or missing")
          else:
              with zipfile.ZipFile(apk) as z:
                  mf = z.read("AndroidManifest.xml")
                  if b"c\x00o\x00m\x00.\x00d\x00a\x00r\x00k\x00m\x00a\x00t\x00t\x00e\x00r\x00.\x00v\x00r\x00c\x00h\x00a\x00t\x00" not in mf:
                      errors.append("FAIL: com.darkmatter.vrchat not in modded APK manifest")
                  else:
                      print(f"OK: {apk} {os.path.getsize(apk)//1024//1024}MB package=com.darkmatter.vrchat")

          # Check module APK
          mod = "darkmatter-module.apk"
          if not os.path.exists(mod) or os.path.getsize(mod) < 50*1024:
              errors.append(f"FAIL: {mod} missing or too small")
          else:
              with zipfile.ZipFile(mod) as z:
                  mf = z.read("AndroidManifest.xml")
                  if b"c\x00o\x00m\x00.\x00d\x00a\x00r\x00k\x00m\x00a\x00t\x00t\x00e\x00r\x00.\x00m\x00e\x00n\x00u\x00" not in mf:
                      errors.append("FAIL: com.darkmatter.menu not in module manifest")
                  else:
                      print(f"OK: {mod} {os.path.getsize(mod)//1024}KB package=com.darkmatter.menu")

          if errors:
              [print(e) for e in errors]
              sys.exit(1)
          print("All checks passed.")
          EOF

      - name: Upload to v1.3 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.3 \
            --title "Darkmatter v1.3 — side-by-side install" \
            --notes "**DarkMatter-modded-signed.apk** — package: com.darkmatter.vrchat — installs ALONGSIDE real VRChat. Auth in real VRChat first, then launch this one to play modded.
          **darkmatter-module.apk** — package: com.darkmatter.menu — Xposed module, scope to com.darkmatter.vrchat in LSPatch.

          absolute ollie, built by olivia — https://discord.gg/ojailbreaks" \
            "DarkMatter-modded-signed.apk" \
            "darkmatter-module.apk" || \
          gh release upload v1.3 "DarkMatter-modded-signed.apk" "darkmatter-module.apk" --clobber
