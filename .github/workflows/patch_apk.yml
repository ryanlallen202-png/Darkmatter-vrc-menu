name: Patch and Release VRChat APK

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 python3-pip wget unzip file
          pip install cryptography --break-system-packages -q

      - name: Reassemble APK
        run: |
          for part in partaa partab partac partad partae partaf partag partah partai partaj partak partal partam partan; do
            wget -q "https://github.com/ryanlallen202-png/Darkmatter-vrc-menu/releases/download/v1.0/DarkMatter.$part" -O "DarkMatter.$part"
          done
          cat DarkMatter.part* > VRChat.apk && rm -f DarkMatter.part*
          echo "APK: $(du -sh VRChat.apk | cut -f1)"

      - name: Extract + patch + sign
        run: |
          mkdir -p unpacked/lib/arm64-v8a
          unzip -q VRChat.apk lib/arm64-v8a/libvrc_fast_crypto.so -d unpacked/
          python3 patch.py
          python3 sign.py
          python3 build_module.py

      - name: Verify APKs
        run: |
          python3 - << 'EOF'
          import zipfile, os, sys

          errors = []

          # Check patched APK
          apk = "DarkMatter-patched-signed.apk"
          if not os.path.exists(apk) or os.path.getsize(apk) < 100*1024*1024:
              errors.append(f"FAIL: {apk} missing or too small")
          else:
              with zipfile.ZipFile(apk) as z:
                  names = z.namelist()
                  if "lib/arm64-v8a/libvrc_fast_crypto.so" not in names:
                      errors.append("FAIL: patched lib missing from APK")
                  if not any(n.startswith("META-INF/") for n in names):
                      errors.append("FAIL: APK not signed")
              print(f"OK: {apk} ({os.path.getsize(apk)//1024//1024}MB)")

          # Check module APK
          mod = "darkmatter-module.apk"
          if not os.path.exists(mod) or os.path.getsize(mod) < 100*1024:
              errors.append(f"FAIL: {mod} missing or too small")
          else:
              with zipfile.ZipFile(mod) as z:
                  names = z.namelist()
                  if "AndroidManifest.xml" not in names:
                      errors.append("FAIL: module has no manifest")
                  if "assets/xposed_init" not in names:
                      errors.append("FAIL: module has no xposed_init")
                  if not any("libdarkmatter" in n for n in names):
                      errors.append("FAIL: module has no .so")
              print(f"OK: {mod} ({os.path.getsize(mod)//1024}KB)")

          if errors:
              for e in errors: print(e)
              sys.exit(1)
          print("All checks passed.")
          EOF

      - name: Create v1.1 release and upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          name: "Darkmatter v1.1 — patched + module"
          body: |
            ## Darkmatter v1.1

            **DarkMatter-patched-signed.apk** — patched VRChat, install via ADB or sideloader
            **darkmatter-module.apk** — Xposed module (com.darkmatter.vrc), scope to VRChat in LSPatch

            Install order:
            1. Install DarkMatter-patched-signed.apk
            2. Install darkmatter-module.apk
            3. LSPatch -> Manage -> VRChat -> Module scope -> + -> Darkmatter VRC
            4. Reboot

            absolute ollie, built by olivia — https://discord.gg/ojailbreaks
          files: |
            DarkMatter-patched-signed.apk
            darkmatter-module.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
