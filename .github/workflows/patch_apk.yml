name: Patch and Release VRChat APK

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 python3-pip wget unzip file
          pip install cryptography --break-system-packages -q

      - name: Reassemble APK
        run: |
          for part in partaa partab partac partad partae partaf partag partah partai partaj partak partal partam partan; do
            wget -q "https://github.com/ryanlallen202-png/Darkmatter-vrc-menu/releases/download/v1.0/DarkMatter.$part" -O "DarkMatter.$part"
          done
          cat DarkMatter.part* > VRChat.apk && rm -f DarkMatter.part*
          echo "APK: $(du -sh VRChat.apk | cut -f1)"

      - name: Extract + patch + sign
        run: |
          mkdir -p unpacked/lib/arm64-v8a
          unzip -q VRChat.apk lib/arm64-v8a/libvrc_fast_crypto.so -d unpacked/
          python3 patch.py
          python3 sign.py
          python3 build_module.py

      - name: Verify both APKs
        run: |
          python3 - << 'EOF'
          import zipfile, os, sys
          errors = []

          apk = "DarkMatter-patched-signed.apk"
          if not os.path.exists(apk) or os.path.getsize(apk) < 100*1024*1024:
              errors.append(f"FAIL: {apk} missing or too small ({os.path.getsize(apk) if os.path.exists(apk) else 0})")
          else:
              with zipfile.ZipFile(apk) as z:
                  if "lib/arm64-v8a/libvrc_fast_crypto.so" not in z.namelist():
                      errors.append("FAIL: patched lib missing")
                  if not any(n.startswith("META-INF/") for n in z.namelist()):
                      errors.append("FAIL: APK unsigned")
              print(f"OK: {apk} {os.path.getsize(apk)//1024//1024}MB")

          mod = "darkmatter-module.apk"
          if not os.path.exists(mod) or os.path.getsize(mod) < 50*1024:
              errors.append(f"FAIL: {mod} missing or too small ({os.path.getsize(mod) if os.path.exists(mod) else 0}B)")
          else:
              with zipfile.ZipFile(mod) as z:
                  names = z.namelist()
                  if "AndroidManifest.xml" not in names: errors.append("FAIL: no manifest")
                  if not any(".so" in n for n in names): errors.append("FAIL: no .so in module")
              print(f"OK: {mod} {os.path.getsize(mod)//1024}KB")

          if errors:
              [print(e) for e in errors]
              sys.exit(1)
          print("All checks passed.")
          EOF

      - name: Delete old v1.2 assets if exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.2 --json assets --jq '.assets[].name' 2>/dev/null | while read name; do
            echo "Deleting old asset: $name"
            gh release delete-asset v1.2 "$name" -y 2>/dev/null || true
          done

      - name: Upload to v1.2 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.2 \
            "DarkMatter-patched-signed.apk" \
            "darkmatter-module.apk" \
            --clobber
          echo "Uploaded both APKs to v1.2"
