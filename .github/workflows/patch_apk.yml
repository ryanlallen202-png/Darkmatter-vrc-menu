name: Patch and Release VRChat APK

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 python3-pip wget
          pip install cryptography --break-system-packages -q

      - name: Download and reassemble APK from parts
        run: |
          for part in partaa partab partac partad partae partaf partag partah partai partaj partak partal partam partan; do
            echo "Downloading DarkMatter.$part..."
            wget -q "https://github.com/ryanlallen202-png/Darkmatter-vrc-menu/releases/download/v1.0/DarkMatter.$part" \
              -O "DarkMatter.$part"
          done
          cat DarkMatter.part* > VRChat.apk
          echo "Reassembled: $(du -sh VRChat.apk | cut -f1)"
          rm DarkMatter.part*

      - name: Patch libvrc_fast_crypto.so
        run: |
          mkdir -p unpacked
          unzip -q VRChat.apk lib/arm64-v8a/libvrc_fast_crypto.so -d unpacked/
          python3 patch.py

      - name: Sign APK
        run: python3 sign.py

      - name: Upload patched APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: DarkMatter-patched-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
