name: Patch and Release VRChat APK

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 python3-pip wget unzip aapt2
          pip install cryptography --break-system-packages -q

      - name: Install Android SDK platform for aapt2
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-32" "build-tools;34.0.0" --sdk_root=$ANDROID_HOME 2>&1 | tail -5

      - name: Reassemble APK from parts
        run: |
          for part in partaa partab partac partad partae partaf partag partah partai partaj partak partal partam partan; do
            wget -q "https://github.com/ryanlallen202-png/Darkmatter-vrc-menu/releases/download/v1.0/DarkMatter.$part" \
              -O "DarkMatter.$part"
          done
          cat DarkMatter.part* > VRChat.apk
          rm -f DarkMatter.part*
          echo "APK: $(du -sh VRChat.apk | cut -f1)"

      - name: Extract libvrc_fast_crypto.so
        run: |
          mkdir -p unpacked/lib/arm64-v8a module/assets
          unzip -q VRChat.apk lib/arm64-v8a/libvrc_fast_crypto.so -d unpacked/

      - name: Patch libvrc_fast_crypto.so
        run: python3 patch.py

      - name: Sign VRChat APK
        run: python3 sign.py

      - name: Build Darkmatter module APK
        run: |
          export AAPT2=$ANDROID_HOME/build-tools/34.0.0/aapt2
          export ANDROID_JAR=$ANDROID_HOME/platforms/android-32/android.jar
          python3 build_module.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: |
            DarkMatter-patched-signed.apk
            darkmatter-module.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
