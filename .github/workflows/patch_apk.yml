name: Patch and Release

on:
  workflow_run:
    workflows: ["Build libdarkmatter.so"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Extract libs
        uses: actions/download-artifact@v4
        with:
          name: libdarkmatter
          path: libs/

      - name: Patch + inject Frida gadget
        run: |
          # Resolve latest Frida gadget for arm64 — hits GitHub releases API
          # so it doesn't hardcode a version that rots
          FRIDA_TAG=$(curl -sf \
            "https://api.github.com/repos/frida/frida/releases/latest" \
            | grep '"tag_name"' | sed 's/.*"tag_name": "\(.*\)".*/\1/')
          [ -z "$FRIDA_TAG" ] && FRIDA_TAG="16.5.6"
          echo "Frida tag: ${FRIDA_TAG}"

          GADGET_URL="https://github.com/frida/frida/releases/download/${FRIDA_TAG}/frida-gadget-${FRIDA_TAG}-android-arm64.so.gz"
          echo "Gadget URL: ${GADGET_URL}"

          curl -Lf -o /tmp/gadget.so.gz "${GADGET_URL}" || {
            echo "Primary URL failed, trying fallback CDN..."
            curl -Lf -o /tmp/gadget.so.gz \
              "https://github.com/frida/frida/releases/download/${FRIDA_TAG}/frida-gadget-${FRIDA_TAG}-android-arm64.so.gz"
          }
          gunzip -f /tmp/gadget.so.gz
          cp /tmp/gadget.so gadget.so
          echo "FRIDA_GADGET_PATH=$(pwd)/gadget.so" >> "$GITHUB_ENV"
          python3 patch.py

      - name: Enable wrap.sh in AndroidManifest
        run: |
          if [ -f AndroidManifest.xml ]; then
            sed -i 's|android:extractNativeLibs="false"|android:extractNativeLibs="true"|g' \
              AndroidManifest.xml
          fi

      - name: Repack + Sign APK
        run: |
          if [ -f repack.sh ]; then
            bash repack.sh
          else
            echo "No repack.sh found — skipping repack"
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: patched-${{ github.run_number }}
          files: |
            *.apk
            libdarkmatter.so
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
