name: Patch and Release VRChat APK

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 python3-pip wget unzip file
          pip install cryptography --break-system-packages -q

      - name: Reassemble APK
        run: |
          for part in partaa partab partac partad partae partaf partag partah partai partaj partak partal partam partan; do
            wget -q "https://github.com/ryanlallen202-png/Darkmatter-vrc-menu/releases/download/v1.0/DarkMatter.$part" -O "DarkMatter.$part"
          done
          cat DarkMatter.part* > VRChat.apk && rm -f DarkMatter.part*
          echo "APK: $(du -sh VRChat.apk | cut -f1)"

      - name: Extract + patch lib
        run: |
          mkdir -p unpacked/lib/arm64-v8a
          unzip -q VRChat.apk lib/arm64-v8a/libvrc_fast_crypto.so -d unpacked/
          python3 patch.py

      - name: Build modded VRChat APK
        run: python3 sign.py

      - name: Build Darkmatter module APK
        run: python3 build_module.py

      - name: Verify both APKs
        run: |
          python3 - << 'EOF'
          import zipfile, os, sys
          errors = []
          apk = "DarkMatter-modded-signed.apk"
          if not os.path.exists(apk) or os.path.getsize(apk) < 100*1024*1024:
              errors.append(f"FAIL: {apk} too small or missing")
          else:
              with zipfile.ZipFile(apk) as z:
                  if not any(n.startswith("META-INF/") for n in z.namelist()):
                      errors.append("FAIL: APK unsigned")
              print(f"OK: {apk} {os.path.getsize(apk)//1024//1024}MB")
          mod = "darkmatter-module.apk"
          if not os.path.exists(mod) or os.path.getsize(mod) < 50*1024:
              errors.append(f"FAIL: {mod} missing or too small")
          else:
              print(f"OK: {mod} {os.path.getsize(mod)//1024}KB")
          if errors:
              [print(e) for e in errors]
              sys.exit(1)
          print("All checks passed.")
          EOF

      - name: Upload to v1.4 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.4 \
            --title "Darkmatter v1.4 — crash fix" \
            --notes "**DarkMatter-modded-signed.apk** — patched VRChat, original package name kept so libil2cpp does not crash. Install alongside real VRChat using LSPatch signature bypass.
          **darkmatter-module.apk** — Xposed module package com.darkmatter.menu

          Install order:
          1. Open LSPatch, patch DarkMatter-modded-signed.apk with Local mode + Signature bypass
          2. Install darkmatter-module.apk
          3. LSPatch Manage, scope Darkmatter Menu to VRChat
          4. Auth in real VRChat, then launch patched one

          absolute ollie, built by olivia — https://discord.gg/ojailbreaks" \
            "DarkMatter-modded-signed.apk" \
            "darkmatter-module.apk" || \
          gh release upload v1.4 "DarkMatter-modded-signed.apk" "darkmatter-module.apk" --clobber
