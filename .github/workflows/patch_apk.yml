name: Patch and Release VRChat APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v2.0)"
        required: false
        default: ""

jobs:
  patch:
    runs-on: ubuntu-24.04

    env:
      MODULE_PKG:  com.darkmatter.vrcmenu
      SIGNED_PKG:  com.darkmatter.vrcmenu.signed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 python3-pip wget unzip
          pip install cryptography --break-system-packages -q

      - name: Reassemble APK from parts
        run: |
          for part in partaa partab partac partad partae partaf partag partah partai partaj partak partal partam partan; do
            wget -q "https://github.com/ryanlallen202-png/Darkmatter-vrc-menu/releases/download/v1.0/DarkMatter.$part" \
              -O "DarkMatter.$part"
          done
          cat DarkMatter.part* > VRChat.apk
          rm -f DarkMatter.part*
          echo "APK size: $(du -sh VRChat.apk | cut -f1)"

      - name: Extract libvrc_fast_crypto.so
        run: |
          mkdir -p unpacked/lib/arm64-v8a
          unzip -q VRChat.apk lib/arm64-v8a/libvrc_fast_crypto.so -d unpacked/

      - name: Patch libvrc_fast_crypto.so
        run: python3 patch.py

      - name: Download latest Frida gadget
        run: |
          FRIDA_VER=$(curl -s https://api.github.com/repos/frida/frida/releases/latest \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          echo "Frida: $FRIDA_VER"
          GADGET_URL="https://github.com/frida/frida/releases/download/${FRIDA_VER}/frida-gadget-${FRIDA_VER}-android-arm64.so.gz"
          curl -fL "$GADGET_URL" -o gadget.so.gz
          gunzip gadget.so.gz
          mv gadget.so frida-gadget.so
          echo "Gadget: $(du -sh frida-gadget.so | cut -f1)"

      - name: Download latest libdarkmatter.so from build artifact
        run: |
          ART_URL=$(curl -s \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=5" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            | python3 -c "
          import json,sys
          arts=[a for a in json.load(sys.stdin)['artifacts'] if 'darkmatter-release' in a['name'] and not a['expired']]
          print(arts[0]['archive_download_url']) if arts else print('')
          ")
          if [ -n "$ART_URL" ]; then
            curl -fL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$ART_URL" -o dm.zip
            unzip -q dm.zip
            echo "libdarkmatter.so: $(du -sh libdarkmatter.so | cut -f1)"
          else
            echo "No artifact found — will use patched crypto .so as fallback"
          fi

      - name: Sign VRChat APK (package=${{ env.SIGNED_PKG }})
        env:
          SIGNED_PKG: ${{ env.SIGNED_PKG }}
        run: python3 sign.py

      - name: Build Darkmatter module APK (package=${{ env.MODULE_PKG }})
        env:
          MODULE_PKG: ${{ env.MODULE_PKG }}
        run: python3 build_module.py

      - name: Compute release tag
        id: tag
        run: |
          INPUT="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT" ]; then
            echo "tag=$INPUT" >> $GITHUB_OUTPUT
          else
            echo "tag=patched-$(date +%Y%m%d)-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Delete stale assets from v1.0 release
        run: |
          python3 - << 'EOF'
          import json, urllib.request, urllib.error
          TOKEN = "${{ secrets.GITHUB_TOKEN }}"
          OWNER = "ryanlallen202-png"
          REPO  = "Darkmatter-vrc-menu"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{OWNER}/{REPO}/releases/442843474/assets",
              headers={"Authorization": f"token {TOKEN}", "Accept": "application/vnd.github+json"}
          )
          with urllib.request.urlopen(req) as r:
              assets = json.loads(r.read())
          stale = ["darkmatter-module.apk","DarkMatter-patched-signed.apk","libvrc_fast_crypto_patched.so"]
          for a in assets:
              if a["name"] in stale:
                  del_req = urllib.request.Request(
                      f"https://api.github.com/repos/{OWNER}/{REPO}/releases/assets/{a['id']}",
                      headers={"Authorization": f"token {TOKEN}", "Accept": "application/vnd.github+json"},
                      method="DELETE"
                  )
                  try:
                      urllib.request.urlopen(del_req)
                      print(f"Deleted: {a['name']}")
                  except Exception as e:
                      print(f"Skip: {e}")
          EOF

      - name: Create new release with both APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Darkmatter ${{ steps.tag.outputs.tag }} — patched VRChat + module"
          prerelease: ${{ !startsWith(steps.tag.outputs.tag, 'v') }}
          body: |
            ## Darkmatter ${{ steps.tag.outputs.tag }}

            ### Files
            | File | Description |
            |------|-------------|
            | `darkmatter-module.apk` | LSPosed/Zygisk module — package `com.darkmatter.vrcmenu` |
            | `DarkMatter-patched-signed.apk` | Patched VRChat APK — package `com.darkmatter.vrcmenu.signed` |

            ### Install
            1. Flash `darkmatter-module.apk` via LSPosed or Zygisk
            2. Sideload `DarkMatter-patched-signed.apk` — replaces stock VRChat
            3. Enable module in LSPosed → scope VRChat → reboot

            Built from `${{ github.sha }}`
          files: |
            DarkMatter-patched-signed.apk
            darkmatter-module.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
