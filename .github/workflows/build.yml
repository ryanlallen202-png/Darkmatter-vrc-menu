name: Build vrc-quest

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NDK r27c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r27c" >> $GITHUB_ENV

      - name: Install CMake + Ninja
        run: sudo apt-get install -y cmake ninja-build

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja
          cmake --build build

      - name: Collect
        run: |
          mkdir -p out
          cp build/libvrc-quest.so out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vrc-quest
          path: out/libvrc-quest.so
