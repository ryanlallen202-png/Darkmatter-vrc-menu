name: Build libdarkmatter.so

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK r26c
        run: |
          NDKV="r27c"
          NDK_ZIP="android-ndk-${NDKV}-linux.zip"
          curl -L -o "${NDK_ZIP}" \
            "https://dl.google.com/android/repository/${NDK_ZIP}"
          unzip -q "${NDK_ZIP}"
          echo "NDK_HOME=$(pwd)/android-ndk-${NDKV}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$(pwd)/android-ndk-${NDKV}" >> "$GITHUB_ENV"

      - name: Swap main
        run: |
          if [ -f main.cpp ]; then
            cp main.cpp Darkmatter-vrc-menu/main.cpp 2>/dev/null || true
          fi

      - name: Get ShadowHook
        run: |
          # ByteDance ShadowHook — fetch latest release tag then pull the AAR
          SHADOWHOOK_TAG=$(curl -sf \
            "https://api.github.com/repos/bytedance/android-inline-hook/releases/latest" \
            | grep '"tag_name"' | sed 's/.*"tag_name": "\(.*\)".*/\1/')
          [ -z "$SHADOWHOOK_TAG" ] && SHADOWHOOK_TAG="v1.1.1"
          echo "ShadowHook tag: ${SHADOWHOOK_TAG}"

          mkdir -p libs/shadowhook/jni/arm64-v8a
          mkdir -p libs/shadowhook/include

          # Download the AAR
          AAR_URL="https://github.com/bytedance/android-inline-hook/releases/download/${SHADOWHOOK_TAG}/shadowhook-android-release.aar"
          curl -Lf -o /tmp/shadowhook.aar "${AAR_URL}" || {
            # Fallback: Maven Central
            curl -Lf -o /tmp/shadowhook.aar \
              "https://repo1.maven.org/maven2/com/bytedance/android/shadowhook/${SHADOWHOOK_TAG#v}/shadowhook-${SHADOWHOOK_TAG#v}.aar"
          }

          # Extract .so and headers from AAR (it's a zip)
          cd /tmp && unzip -q shadowhook.aar -d shadowhook_aar || true
          find /tmp/shadowhook_aar -name "*.so" -path "*arm64-v8a*" \
            -exec cp {} "$GITHUB_WORKSPACE/libs/shadowhook/jni/arm64-v8a/" \;
          find /tmp/shadowhook_aar -name "*.h" \
            -exec cp {} "$GITHUB_WORKSPACE/libs/shadowhook/include/" \;

          # Verify we got something
          ls -la "$GITHUB_WORKSPACE/libs/shadowhook/jni/arm64-v8a/"
          ls -la "$GITHUB_WORKSPACE/libs/shadowhook/include/"

      - name: Get FFmpegKit
        run: |
          FFMPEG_TAG="6.0-2"
          mkdir -p libs/ffmpeg/jni/arm64-v8a
          mkdir -p libs/ffmpeg/include
          curl -Lf -o /tmp/ffmpegkit.aar \
            "https://github.com/arthenica/ffmpeg-kit/releases/download/v${FFMPEG_TAG}/ffmpeg-kit-min-arm64-v8a-${FFMPEG_TAG}.aar" || \
          curl -Lf -o /tmp/ffmpegkit.aar \
            "https://repo1.maven.org/maven2/com/arthenica/ffmpeg-kit-min/${FFMPEG_TAG}/ffmpeg-kit-min-${FFMPEG_TAG}.aar"
          cd /tmp && unzip -q ffmpegkit.aar -d ffmpegkit_aar || true
          find /tmp/ffmpegkit_aar -name "*.so" -path "*arm64-v8a*" \
            -exec cp {} "$GITHUB_WORKSPACE/libs/ffmpeg/jni/arm64-v8a/" \;
          find /tmp/ffmpegkit_aar -name "*.h" \
            -exec cp {} "$GITHUB_WORKSPACE/libs/ffmpeg/include/" \;

      - name: CMake Configure
        run: |
          cmake \
            -S Darkmatter-vrc-menu \
            -B build \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_NDK="${ANDROID_NDK_HOME}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSHADOWHOOK_INCLUDE_DIR="${GITHUB_WORKSPACE}/libs/shadowhook/include" \
            -DSHADOWHOOK_LIB_DIR="${GITHUB_WORKSPACE}/libs/shadowhook/jni/arm64-v8a"

      - name: CMake Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Locate .so
        run: |
          SO_PATH=$(find build -name "libdarkmatter.so" | head -1)
          echo "LIBSO_PATH=${SO_PATH}" >> "$GITHUB_ENV"
          echo "Found: ${SO_PATH}"

      - name: Upload libdarkmatter.so
        uses: actions/upload-artifact@v4
        with:
          name: libdarkmatter
          path: ${{ env.LIBSO_PATH }}

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: ${{ env.LIBSO_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: libdarkmatter.so" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
