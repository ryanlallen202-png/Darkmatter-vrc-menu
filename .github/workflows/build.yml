# .github/workflows/build.yml
name: Build libdarkmatter.so

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK r26c
        run: |
          ANDROID_SDK_ROOT="${HOME}/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/ndk"
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r26c-linux.zip"
          curl -L "$NDK_URL" -o ndk.zip
          unzip -q ndk.zip -d "$ANDROID_SDK_ROOT/ndk"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/android-ndk-r26c" >> $GITHUB_ENV
          echo "NDK_ROOT=$ANDROID_SDK_ROOT/ndk/android-ndk-r26c" >> $GITHUB_ENV

      - name: Swap main
        run: |
          if [ -f main.cpp ]; then
            cp main.cpp Darkmatter-vrc-menu/main.cpp 2>/dev/null || true
          fi

      - name: Get ShadowHook
        run: |
          # Resolve latest ShadowHook release dynamically — no hardcoded tag
          SHADOWHOOK_LATEST=$(curl -s https://api.github.com/repos/bytedance/android-inline-hook/releases/latest \
            | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "ShadowHook tag: $SHADOWHOOK_LATEST"

          DOWNLOAD_URL="https://github.com/bytedance/android-inline-hook/releases/download/${SHADOWHOOK_LATEST}/shadowhook-android-${SHADOWHOOK_LATEST}.zip"
          echo "Downloading: $DOWNLOAD_URL"

          mkdir -p libs/shadowhook
          curl -L --fail "$DOWNLOAD_URL" -o shadowhook.zip
          unzip -q shadowhook.zip -d libs/shadowhook
          echo "ShadowHook extracted:"
          find libs/shadowhook -type f | head -30

      - name: Get FFmpegKit
        run: |
          FFKIT_LATEST=$(curl -s https://api.github.com/repos/arthenica/ffmpeg-kit/releases/latest \
            | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "FFmpegKit tag: $FFKIT_LATEST"
          mkdir -p libs/ffmpegkit
          curl -L --fail \
            "https://github.com/arthenica/ffmpeg-kit/releases/download/${FFKIT_LATEST}/ffmpeg-kit-min-${FFKIT_LATEST}-android-arm64-v8a.zip" \
            -o ffmpegkit.zip || echo "WARN: FFmpegKit download failed, continuing"
          [ -f ffmpegkit.zip ] && unzip -q ffmpegkit.zip -d libs/ffmpegkit || true

      - name: CMake Configure
        run: |
          mkdir -p build
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_NDK="$ANDROID_NDK_ROOT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSHADOWHOOK_ROOT="${{ github.workspace }}/libs/shadowhook" \
            -S .

      - name: CMake Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Locate .so
        id: locate
        run: |
          SO_PATH=$(find build -name "*.so" | head -1)
          echo "so_path=$SO_PATH" >> $GITHUB_OUTPUT
          echo "Found: $SO_PATH"

      - name: Upload libdarkmatter.so
        uses: actions/upload-artifact@v4
        with:
          name: libdarkmatter-arm64-v8a
          path: ${{ steps.locate.outputs.so_path }}

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Darkmatter build ${{ github.run_number }}"
          files: ${{ steps.locate.outputs.so_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: echo "✅ libdarkmatter.so built and uploaded — build ${{ github.run_number }}"
