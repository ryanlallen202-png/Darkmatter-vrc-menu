name: Build Darkmatter

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK r25c
        run: |
          set -euo pipefail
          NDK_ZIP="android-ndk-r25c-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/$NDK_ZIP"
          curl -fsSL -o "$NDK_ZIP" "$NDK_URL"
          unzip -q "$NDK_ZIP" -d "$HOME"
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r25c" >> "$GITHUB_ENV"
          echo "$HOME/android-ndk-r25c" >> "$GITHUB_PATH"

      - name: Write makefiles
        run: |
          cat > Android.mk << 'EOF'
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)
          LOCAL_MODULE        := darkmatter
          LOCAL_SRC_FILES     := main.cpp features.cpp menu.cpp esp.cpp soundboard.cpp
          LOCAL_CPPFLAGS      := -std=c++17 -O2 -Wall -Wextra -fvisibility=hidden \
                                 -ffunction-sections -fdata-sections \
                                 -DANDROID -DNDEBUG
          LOCAL_LDFLAGS       := -Wl,--gc-sections -Wl,-z,relro -Wl,-z,now
          LOCAL_LDLIBS        := -llog -landroid -ldl
          include $(BUILD_SHARED_LIBRARY)
          EOF
          cat > Application.mk << 'EOF'
          APP_ABI      := arm64-v8a
          APP_PLATFORM := android-29
          APP_STL      := c++_static
          APP_OPTIM    := release
          EOF

      - name: Verify source tree
        run: |
          for f in shared.hpp main.cpp features.cpp menu.cpp esp.cpp soundboard.cpp; do
            [ -f "$f" ] || { echo "Missing: $f"; exit 1; }
          done

      - name: ndk-build
        run: |
          "$ANDROID_NDK_ROOT/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-29 \
            APP_STL=c++_static \
            APP_OPTIM=release \
            -j$(nproc)

      - name: Verify .so + JNI symbols
        run: |
          SO="libs/arm64-v8a/libdarkmatter.so"
          [ -f "$SO" ] || { echo "Build failed — $SO not found"; exit 1; }
          file "$SO"
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -D "$SO" | grep -E "JNI_OnLoad|JNI_OnUnload" \
            || { echo "JNI symbols missing"; exit 1; }

      - name: Strip .so
        run: |
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-unneeded libs/arm64-v8a/libdarkmatter.so

      - name: Rename with version tag
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == v*.*.* ]]; then
            cp libs/arm64-v8a/libdarkmatter.so "libdarkmatter-${TAG}-arm64-v8a.so"
          else
            cp libs/arm64-v8a/libdarkmatter.so "libdarkmatter-build${{ github.run_number }}-arm64-v8a.so"
          fi
          ls -lh libdarkmatter*.so

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkmatter-release
          path: libs/arm64-v8a/libdarkmatter.so
          retention-days: 30

      - name: Create Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Darkmatter ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## Darkmatter VRC Menu ${{ github.ref_name }}

            ### What's included
            - `libdarkmatter-${{ github.ref_name }}-arm64-v8a.so` — stripped arm64 native library, built with NDK r25c
            - Install via patch workflow or sideload with your LSPosed/Zygisk setup

            ### Checksums
            Run `sha256sum libdarkmatter-*.so` to verify.
          files: "libdarkmatter-${{ github.ref_name }}-arm64-v8a.so"
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create rolling dev release on main push
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: "Darkmatter dev-build #${{ github.run_number }}"
          tag_name: "dev-${{ github.run_number }}"
          prerelease: true
          body: |
            ## Dev build #${{ github.run_number }}

            Automated build from main — `${{ github.sha }}` (${{ github.event.head_commit.message }})

            - `libdarkmatter-build${{ github.run_number }}-arm64-v8a.so` — arm64 stripped .so
          files: "libdarkmatter-build${{ github.run_number }}-arm64-v8a.so"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
