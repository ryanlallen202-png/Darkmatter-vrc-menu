# .github/workflows/build.yml
# Triggers on every push to main and on pull requests.
# Builds libdarkmatter.so (arm64-v8a, android-29) via NDK r25c.
# Artifact: darkmatter-release containing the .so ready to push to device.

name: Build Darkmatter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout
      # ------------------------------------------------------------------ #
      - name: Checkout repo
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. Set up JDK (NDK toolchain needs it)
      # ------------------------------------------------------------------ #
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ------------------------------------------------------------------ #
      # 3. Install Android NDK r25c
      # ------------------------------------------------------------------ #
      - name: Install Android NDK r25c
        run: |
          set -euo pipefail
          NDK_ZIP="android-ndk-r25c-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/$NDK_ZIP"
          echo "[*] Downloading NDK r25c"
          curl -fsSL -o "$NDK_ZIP" "$NDK_URL"
          unzip -q "$NDK_ZIP" -d "$HOME"
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r25c" >> "$GITHUB_ENV"
          echo "$HOME/android-ndk-r25c" >> "$GITHUB_PATH"

      # ------------------------------------------------------------------ #
      # 4. Verify source files exist
      # ------------------------------------------------------------------ #
      - name: Verify source tree
        run: |
          for f in shared.hpp main.cpp features.cpp menu.cpp esp.cpp soundboard.cpp Android.mk Application.mk; do
            [ -f "$f" ] || { echo "[-] Missing: $f"; exit 1; }
          done
          echo "[+] Source tree OK"

      # ------------------------------------------------------------------ #
      # 5. ndk-build
      # ------------------------------------------------------------------ #
      - name: ndk-build
        run: |
          set -euo pipefail
          "$ANDROID_NDK_ROOT/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-29 \
            APP_STL=c++_static \
            APP_OPTIM=release \
            -j$(nproc)

      # ------------------------------------------------------------------ #
      # 6. Verify output
      # ------------------------------------------------------------------ #
      - name: Verify .so
        run: |
          SO="libs/arm64-v8a/libdarkmatter.so"
          [ -f "$SO" ] || { echo "[-] Build failed — $SO not found"; exit 1; }
          echo "[+] Built: $(du -sh $SO)"
          file "$SO"
          # Confirm arm64 and no missing JNI symbols
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -D "$SO" | grep -E "JNI_OnLoad|JNI_OnUnload" \
            || { echo "[-] JNI symbols missing"; exit 1; }
          echo "[+] JNI symbols present"

      # ------------------------------------------------------------------ #
      # 7. Strip debug info for release
      # ------------------------------------------------------------------ #
      - name: Strip .so
        run: |
          STRIP="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$STRIP" --strip-unneeded libs/arm64-v8a/libdarkmatter.so
          echo "[+] Stripped: $(du -sh libs/arm64-v8a/libdarkmatter.so)"

      # ------------------------------------------------------------------ #
      # 8. Upload artifact
      # ------------------------------------------------------------------ #
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkmatter-release
          path: libs/arm64-v8a/libdarkmatter.so
          retention-days: 30

      # ------------------------------------------------------------------ #
      # 9. Create release on tag push (v*.*.*)
      # ------------------------------------------------------------------ #
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: libs/arm64-v8a/libdarkmatter.so
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
