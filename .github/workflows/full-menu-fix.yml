name: Darkmatter-VRC-Menu Complete Fix

on:
  workflow_dispatch:
    inputs:
      image-url:
        description: 'Uploaded image URL'
        required: true

jobs:
  fix-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download uploaded image
        run: |
          curl -sL -o "assets/vrc/menus/oculus_vrshell.jpg" "${{ github.event.inputs.image-url }}"

      - name: Fix corrupted assets
        run: |
          # Fix menu_03.png alpha channel corruption
          ffmpeg -i assets/vrc/menus/menu_03.png \
            -c:v libx264 -pix_fmt yuv420p \
            -y assets/vrc/menus/menu_03_fixed.png




