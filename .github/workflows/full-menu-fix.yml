# .github/workflows/full-menu-fix.yml
name: Darkmatter-VRC-Menu Complete Fix

on:
  workflow_dispatch:
    inputs:
      image-url:
        description: 'Uploaded image URL'
        required: true

jobs:
  fix-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

- name: Download uploaded image
        run: |
          curl -sL -o "assets/vrc/menus/oculus_vrshell.jpg" "${{ github.event.inputs.image-url }}"

- name: Fix corrupted assets
        run: |
          # Fix menu_03.png alpha channel corruption
          ffmpeg -i assets/vrc/menus/menu_03.png -c:v libx264 -pix_fmt yuv420p -y assets/vrc/menus/menu_03_fixed.png

# Add missing assets
          mkdir -p assets/{icons,fonts}
          wget -O assets/icons/icon_64x64.png "https://raw.githubusercontent.com/ryanlallen202-png/Darkmatter-vrc-menu/v2.0/assets/icons/icon_64x64.png"
          wget -O assets/fonts/Roboto-Regular.ttf "https://fonts.google.com/specimen/Roboto/Download"

- name: Download v2.0 assets
        run: |
          wget -P assets/vrc/menus/ "https://raw.githubusercontent.com/ryanlallen202-png/Darkmatter-vrc-menu/v2.0/assets/vrc/menus/vrc_menu_128x128.png"

- name: Merge v2.0 assets
        run: |
          git fetch origin v2.0
          git checkout v2.0
          git pull origin v2.0
          git checkout main
          git merge --no-ff v2.0

- name: Build menu overlay
        run: |
          rm -rf build
          mkdir build && cd build
          cmake -B . -DCMAKE_BUILD_TYPE=Release
          cmake --build . --target menu_overlay --config Release

- name: Upload build
        uses: actions/upload-artifact@v3
        with:
          name: menu-build
          path: build/




